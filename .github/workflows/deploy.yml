name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run check-format

      # The demo build needs no configuration: it reads only saved snapshots.
      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.68.1'
          command: pages deploy dist/ --project-name=boyk --branch=main

      - name: Check the live site
        run: |
          sleep 20
          curl -sf -o /dev/null https://boyk.org
          curl -sf "https://boyk.org/neo4j-api/api/companies/search?q=nestle&limit=1" | grep -q '"id"'
